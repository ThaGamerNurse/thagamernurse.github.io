<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Not found - Andrew Gaston</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A9%BA%3C/text%3E%3C/svg%3E">
<style>
:root{
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --pad:clamp(1.25rem,5vw,2.5rem);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sf);min-height:100dvh;display:grid;place-items:center;
  text-align:center;padding:var(--pad);color:#f5f5f7;
  background:radial-gradient(120% 90% at 50% 0%,#1c1c1e 0%,#000 62%);
  -webkit-font-smoothing:antialiased;letter-spacing:-.012em}
.code{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:#86868b;margin-bottom:1.35rem}
h1{font-size:clamp(34px,7vw,60px);line-height:1.05;letter-spacing:-.03em;font-weight:700;
  text-wrap:balance;max-width:16ch;margin:0 auto}
p{font-size:clamp(17px,2vw,20px);line-height:1.5;color:#86868b;margin:1.25rem auto 0;
  max-width:40ch}
.cta{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center;margin-top:2.25rem}
a.btn{display:inline-flex;align-items:center;justify-content:center;background:#2997ff;
  color:#000;border-radius:980px;padding:.7rem 1.35rem;font-size:16px;text-decoration:none;
  letter-spacing:-.01em}
a.btn:hover{background:#5eb0ff}
a.btn2{background:none;border:1px solid #48484a;color:#f5f5f7}
a.btn2:hover{background:rgba(255,255,255,.08)}
a:focus-visible{outline:3px solid #2997ff;outline-offset:3px}
</style>
</head>
<body>
  <div>
    <p class="code">Error 404</p>
    <h1>That page isn't here.</h1>
    <p>Either it moved or it never existed. The work is all one page, so the front door is
      probably what you want.</p>
    <div class="cta">
      <a class="btn" href="/">Go to the work</a>
      <a class="btn btn2" href="/writing/">Writing</a>
    </div>
  </div>
</body>
</html>
